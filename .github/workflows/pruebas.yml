name: Pruebas de metrados y presupuesto
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compilar sintaxis
        run: python -m compileall -q scripts tests
      - name: Pruebas unitarias y de integración
        run: python -m unittest discover -s tests -v
